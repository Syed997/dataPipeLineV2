receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:54317"
      http:
        endpoint: "0.0.0.0:4318"

  # Host metrics receiver - collects system/compute metrics
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      network:
      load:
      paging:
      processes:
      process:
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true

#  # Pod-level resource metrics (requires Kubernetes)
#  kubeletstats:
#    collection_interval: 10s
#    auth_type: serviceAccount
#    endpoint: "https://${env:K8S_NODE_IP}:10250"
#    insecure_skip_verify: true
#    metric_groups:
#      - pod
#      - container
#      - volume
#    metrics:
#      k8s.pod.cpu.utilization:
#        enabled: true
#      k8s.pod.memory.usage:
#        enabled: true
#      k8s.pod.network.io:
#        enabled: true
#      k8s.pod.filesystem.usage:
#        enabled: true
#      container.cpu.utilization:
#        enabled: true
#      container.memory.working_set:
#        enabled: true

processors:
  batch:

  # --- Laravel filters ---
  filter/laravel_traces:
    traces:
      span:
        - 'resource.attributes["service.name"] != "laravel"'
  filter/laravel_metrics:
    metrics:
      datapoint:
        - 'resource.attributes["service.name"] != "laravel"'
  filter/laravel_logs:
    logs:
      log_record:
        - 'resource.attributes["service.name"] != "laravel"'

  # --- Flask filters ---
  filter/flask_traces:
    traces:
      span:
        - 'resource.attributes["service.name"] != "flask"'
  filter/flask_metrics:
    metrics:
      datapoint:
        - 'resource.attributes["service.name"] != "flask"'
  filter/flask_logs:
    logs:
      log_record:
        - 'resource.attributes["service.name"] != "flask"'

  # --- Node filters ---
  filter/node_traces:
    traces:
      span:
        - 'resource.attributes["service.name"] != "node"'
  filter/node_metrics:
    metrics:
      datapoint:
        - 'resource.attributes["service.name"] != "node"'
  filter/node_logs:
    logs:
      log_record:
        - 'resource.attributes["service.name"] != "node"'

  # --- Infrastructure Node-level filters ---
  filter/minikube_node_traces:
    traces:
      span:
        - 'resource.attributes["k8s.node.name"] != "minikube"'
  filter/minikube_node_metrics:
    metrics:
      datapoint:
        - 'resource.attributes["k8s.node.name"] != "minikube"'
  filter/minikube_node_logs:
    logs:
      log_record:
        - 'resource.attributes["k8s.node.name"] != "minikube"'

  # --- Infrastructure Pod-level filters ---
  filter/otel_agent_pod_traces:
    traces:
      span:
        - 'resource.attributes["signoz.component"] != "otel-agent"'
  filter/otel_agent_pod_metrics:
    metrics:
      datapoint:
        - 'resource.attributes["signoz.component"] != "otel-agent"'
  filter/otel_agent_pod_logs:
    logs:
      log_record:
        - 'resource.attributes["signoz.component"] != "otel-agent"'

exporters:
  # --- Laravel ---
  kafka/laravel_traces:
    brokers: ["kafka:9092"]
    topic: demo-laravel-traces
    encoding: otlp_json
  kafka/laravel_metrics:
    brokers: ["kafka:9092"]
    topic: demo-laravel-metrics
    encoding: otlp_json
  kafka/laravel_logs:
    brokers: ["kafka:9092"]
    topic: demo-laravel-logs
    encoding: otlp_json

  # --- Flask ---
  kafka/flask_traces:
    brokers: ["kafka:9092"]
    topic: demo-flask-traces
    encoding: otlp_json
  kafka/flask_metrics:
    brokers: ["kafka:9092"]
    topic: demo-flask-metrics
    encoding: otlp_json
  kafka/flask_logs:
    brokers: ["kafka:9092"]
    topic: demo-flask-logs
    encoding: otlp_json

  # --- Node ---
  kafka/node_traces:
    brokers: ["kafka:9092"]
    topic: demo-node-traces
    encoding: otlp_json
  kafka/node_metrics:
    brokers: ["kafka:9092"]
    topic: demo-node-metrics
    encoding: otlp_json
  kafka/node_logs:
    brokers: ["kafka:9092"]
    topic: demo-node-logs
    encoding: otlp_json

  # --- Infrastructure Node-level ---
  kafka/minikube_node_traces:
    brokers: ["kafka:9092"]
    topic: demo-minikube-node_traces
    encoding: otlp_json
  kafka/minikube_node_metrics:
    brokers: ["kafka:9092"]
    topic: demo-minikube-node_metrics
    encoding: otlp_json
  kafka/minikube_node_logs:
    brokers: ["kafka:9092"]
    topic: demo-minikube-node_logs
    encoding: otlp_json

  # --- Infrastructure Pod-level ---
  kafka/otel_agent_pod_traces:
    brokers: ["kafka:9092"]
    topic: demo-otel-pod_traces
    encoding: otlp_json
  kafka/otel_agent_pod_metrics:
    brokers: ["kafka:9092"]
    topic: demo-otel-pod_metrics
    encoding: otlp_json
  kafka/otel_agent_pod_logs:
    brokers: ["kafka:9092"]
    topic: demo-otel-pod_logs
    encoding: otlp_json

  # --- Host Metrics ---
  kafka/host_metrics:
    brokers: ["kafka:9092"]
    topic: demo-host-metrics
    encoding: otlp_json

  # --- Pod Metrics ---
  kafka/pod_metrics:
    brokers: ["kafka:9092"]
    topic: demo-pod-metrics
    encoding: otlp_json

  # --- Debug (shared) ---
  debug:
    verbosity: detailed

service:
  pipelines:
    # --- Laravel ---
    traces/laravel:
      receivers: [otlp]
      processors: [filter/laravel_traces, batch]
      exporters: [kafka/laravel_traces, debug]

    metrics/laravel:
      receivers: [otlp]
      processors: [filter/laravel_metrics, batch]
      exporters: [kafka/laravel_metrics, debug]

    logs/laravel:
      receivers: [otlp]
      processors: [filter/laravel_logs, batch]
      exporters: [kafka/laravel_logs, debug]

    # --- Flask ---
    traces/flask:
      receivers: [otlp]
      processors: [filter/flask_traces, batch]
      exporters: [kafka/flask_traces, debug]

    metrics/flask:
      receivers: [otlp]
      processors: [filter/flask_metrics, batch]
      exporters: [kafka/flask_metrics, debug]

    logs/flask:
      receivers: [otlp]
      processors: [filter/flask_logs, batch]
      exporters: [kafka/flask_logs, debug]

    # --- Node ---
    traces/node:
      receivers: [otlp]
      processors: [filter/node_traces, batch]
      exporters: [kafka/node_traces, debug]

    metrics/node:
      receivers: [otlp]
      processors: [filter/node_metrics, batch]
      exporters: [kafka/node_metrics, debug]

    logs/node:
      receivers: [otlp]
      processors: [filter/node_logs, batch]
      exporters: [kafka/node_logs, debug]

    # --- Infrastructure Node-level ---
    traces/minikube_node:
      receivers: [otlp]
      processors: [filter/minikube_node_traces, batch]
      exporters: [kafka/minikube_node_traces, debug]

    metrics/minikube_node:
      receivers: [otlp]
      processors: [filter/minikube_node_metrics, batch]
      exporters: [kafka/minikube_node_metrics, debug]

    logs/minikube_node:
      receivers: [otlp]
      processors: [filter/minikube_node_logs, batch]
      exporters: [kafka/minikube_node_logs, debug]

    # --- Infrastructure Pod-level ---
    traces/otel_agent_pod:
      receivers: [otlp]
      processors: [filter/otel_agent_pod_traces, batch]
      exporters: [kafka/otel_agent_pod_traces, debug]

    metrics/otel_agent_pod:
      receivers: [otlp]
      processors: [filter/otel_agent_pod_metrics, batch]
      exporters: [kafka/otel_agent_pod_metrics, debug]

    logs/otel_agent_pod:
      receivers: [otlp]
      processors: [filter/otel_agent_pod_logs, batch]
      exporters: [kafka/otel_agent_pod_logs, debug]

    # --- Host Metrics ---
    metrics/host:
      receivers: [hostmetrics]
      processors: [batch]
      exporters: [kafka/host_metrics] ## Don't need DEBUG FOR NOW

#    # --- Pod Metrics ---
#    metrics/pod:
#      receivers: [kubeletstats]
#      processors: [batch]
#      exporters: [kafka/pod_metrics, debug]